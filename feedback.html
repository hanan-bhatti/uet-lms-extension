<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UET LMS Companion — Submit Feedback</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
  <style>
    html, body {
      width: 100%;
      max-width: 520px;
      height: auto;
      min-height: 100vh;
      margin: 0 auto;
      padding: 32px 20px;
      overflow-y: auto;
      background-color: var(--bg-page);
    }
    .feedback-canvas-wrapper {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .star-rating {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 6px 0;
    }
    .star-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-card);
      border-radius: 10px;
      width: 44px;
      height: 44px;
      font-size: 20px;
      color: var(--pale-slate-2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .star-btn.active, .star-btn:hover {
      background: var(--iron-grey);
      color: var(--bright-snow);
      border-color: var(--bright-snow);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    }
  </style>
</head>
<body>
  <div class="feedback-canvas-wrapper">
    <!-- Container-less Header directly on body -->
    <header style="text-align:center;">
      <span class="editorial-kicker">COMMUNITY FEEDBACK</span>
      <h2 class="editorial-heading">Help Us Improve LMS Journal</h2>
      <p style="font-size:12px; color:var(--text-muted); margin-top:4px;">Submit bug reports, feature requests, or rating scores to the developer</p>
    </header>

    <hr class="editorial-rule">

    <!-- Container-less Form directly on body -->
    <main style="display:flex; flex-direction:column; gap:16px;">
      <div class="input-group">
        <label style="text-align:center; display:block;">YOUR RATING</label>
        <div class="star-rating">
          <button class="star-btn" data-star="1">★</button>
          <button class="star-btn" data-star="2">★</button>
          <button class="star-btn" data-star="3">★</button>
          <button class="star-btn active" data-star="4">★</button>
          <button class="star-btn" data-star="5">★</button>
        </div>
      </div>

      <div class="input-group">
        <label for="feedback-category">CATEGORY</label>
        <select id="feedback-category" class="editorial-select" style="padding:12px;">
          <option value="Bug Report">🐛 Bug Report</option>
          <option value="Feature Request">💡 Feature Request</option>
          <option value="Design Feedback">🎨 Design / Styling Feedback</option>
          <option value="General">💬 General Feedback</option>
        </select>
      </div>

      <div class="input-group">
        <label for="feedback-text">YOUR FEEDBACK / DETAILS</label>
        <textarea id="feedback-text" rows="5" placeholder="Describe the issue or feature idea in detail..." style="background:var(--bg-input); border:1px solid var(--border-card); border-radius:var(--radius-md); padding:12px; color:var(--text-main); font-size:13px; outline:none; resize:vertical;"></textarea>
      </div>

      <button id="btn-submit-feedback" class="editorial-btn-primary" style="margin-top:4px;">
        <span>Submit Feedback to GitHub Issues</span>
        <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </main>

    <hr class="editorial-rule">

    <footer class="editorial-footer" style="background:transparent; border:none; padding:4px;">
      <span>Curated by <a href="https://github.com/hanan-bhatti" target="_blank" class="footer-link">Abdul Hannan Bhatti</a> • UET Computer Science</span>
    </footer>
  </div>

  <script src="feedback.js"></script>
</body>
</html>
